[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightbot"
version = "0.3.1"
description = "Telegram flight price tracking platform (watch-key dedup, transactional outbox, rate-limited broadcaster)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "orjson>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
sentry = ["sentry-sdk>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightbot = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs real PostgreSQL + Redis (TEST_DATABASE_URL / TEST_REDIS_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S101"]
# E501: the formatter doesn't wrap long comments/docstrings; code is formatted by `ruff format`
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"src/flightbot/bot/i18n/*" = ["E501"]
"tests/*" = ["E501"]
