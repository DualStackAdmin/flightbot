# Alertmanager is not wired up: the rules are only visible in the Prometheus UI. In production add Alertmanager / Grafana Cloud.
groups:
  - name: flightbot
    rules:
      - alert: NotificationQueueLagHigh
        expr: notification_queue_lag_seconds > 300
        for: 5m
        annotations:
          summary: "Notification queue is lagging by more than 5 minutes"
          description: "The broadcaster can't keep up. Check the Telegram limit and the replica count (docs/OPERATIONS.md)."

      - alert: TelegramRateLimited
        expr: increase(telegram_errors_total{type="retry_after"}[10m]) > 0
        annotations:
          summary: "Telegram 429 (RetryAfter) received"
          description: "Target = 0. Check TELEGRAM_GLOBAL_RPS and the number of broadcaster replicas."

      - alert: ProviderErrorRateHigh
        expr: >
          sum(rate(provider_requests_total{status!="ok"}[10m]))
          / clamp_min(sum(rate(provider_requests_total[10m])), 0.001) > 0.2
        for: 10m
        annotations:
          summary: "Price provider error rate > 20%"

      - alert: DueKeysBacklog
        expr: due_watch_keys > 500
        for: 15m
        annotations:
          summary: "Poller is falling behind (>500 due keys)"
          description: "The provider RPS limit or the number of poller replicas is not enough."

      - alert: WatchCountDrift
        expr: increase(active_watch_count_drift_total[1h]) > 0
        annotations:
          summary: "active_watch_count does not match the real count (the janitor fixed it)"
          description: "This should never happen. Check that the triggers exist."

      - alert: WorkerDown
        expr: up{job="flightbot-worker"} == 0
        for: 2m
        annotations:
          summary: "Worker is unreachable"
